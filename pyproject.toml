[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "N999",    # Allow CamelCase module names like GitHubIssueExporter.py
    "RUF013",  # Allow implicit Optional
    "SIM117",  # Allow nested with statements in tests
    "C408",    # Allow dict() calls
    "TRY004",  # Allow TypeError/RuntimeError mixups from older code
    "I001",    # Allow flexible import sorting
    "EXE002",  # Ignore executable permission check
]

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "union-attr",
    "assignment",
    "arg-type",
    "var-annotated",
    "return-value",
    "return",
]